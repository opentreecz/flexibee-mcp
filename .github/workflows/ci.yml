name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # ── Format check (Linux only – gofmt output is platform-independent) ──
      - name: fmt-check
        if: matrix.os == 'ubuntu-latest'
        run: |
          unformatted=$(gofmt -l ./...)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      # ── Vet ───────────────────────────────────────────────────────────────
      - name: vet
        run: go vet ./...

      # ── Unit + integration tests ──────────────────────────────────────────
      - name: test
        run: go test -count=1 -timeout 120s ./...

      # ── Cross-compile check (Linux only) ─────────────────────────────────
      - name: build-linux
        if: matrix.os == 'ubuntu-latest'
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build ./cmd/flexibee-mcp/

      - name: build-windows
        if: matrix.os == 'ubuntu-latest'
        run: |
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build ./cmd/flexibee-mcp/
